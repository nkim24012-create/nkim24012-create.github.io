<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Learning App</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  min-height:100vh;
}

/* LOGIN */

.login-box{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}

.login-card{
  background:rgba(255,255,255,0.1);
  padding:30px;
  border-radius:16px;
  width:300px;
  text-align:center;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

input,select{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

/* APP */

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-3px);
}

button{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  background:#3b82f6;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#2563eb;
  transform:scale(1.05);
}

.option{
  display:block;
  padding:10px;
  margin:6px 0;
  background:rgba(255,255,255,0.1);
  border-radius:10px;
  cursor:pointer;
}

.option:hover{
  background:rgba(255,255,255,0.2);
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.badge{
  background:#22c55e;
  padding:5px 10px;
  border-radius:20px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-box" id="loginBox">

  <div class="login-card">

    <h2>Đăng nhập</h2>

    <input id="username" placeholder="Username">

    <button onclick="login()">
      Vào app
    </button>

  </div>

</div>

<!-- APP -->
<div class="container" id="app" style="display:none;">

  <div class="header">

    <h2>📚 Smart Learning</h2>

    <div>
      👤 <span id="user"></span>

      <button onclick="logout()">
        Logout
      </button>
    </div>

  </div>

  <!-- UPLOAD -->
  <div class="card">

    <h3>Upload PDF</h3>

    <select id="subject">
      <option value="math">Toán</option>
      <option value="physics">Lý</option>
      <option value="chemistry">Hóa</option>
      <option value="literature">Văn</option>
      <option value="english_basic">Anh văn - Căn bản</option>
      <option value="english_advanced">Anh văn - Nâng cao</option>
    </select>

    <input type="file" id="pdfInput">

    <button onclick="uploadPDF()">
      Convert
    </button>

  </div>

  <!-- LIST -->
  <div class="card">

    <h3>Danh sách đề</h3>

    <select id="examList"></select>

    <button onclick="loadExam()">Mở</button>

  </div>

  <!-- EXAM -->
  <div class="card">

    <div id="examContent">Chưa có đề</div>

    <div id="scoreBox"></div>

  </div>

</div>

<script>

let currentUser = null;
let currentExam = null;

/* LOGIN SYSTEM */

function login(){

  const name =
    document.getElementById("username").value;

  if(!name) return;

  currentUser = name;

  localStorage.setItem("user",name);

  document.getElementById("loginBox").style.display="none";

  document.getElementById("app").style.display="block";

  document.getElementById("user").innerText=name;

  refreshExamList();

}

function logout(){

  localStorage.removeItem("user");

  location.reload();

}

/* INIT */

window.onload = ()=>{

  const u =
    localStorage.getItem("user");

  if(u){

    currentUser=u;

    document.getElementById("loginBox").style.display="none";

    document.getElementById("app").style.display="block";

    document.getElementById("user").innerText=u;

    refreshExamList();

  }

}

/* EXAMS STORAGE */

function refreshExamList(){

  const list =
    document.getElementById("examList");

  list.innerHTML="";

  const exams =
    JSON.parse(localStorage.getItem("exams")||"[]");

  exams.forEach((e,i)=>{

    list.innerHTML+=`
      <option value="${i}">
        ${e.level? "["+e.level+"]":""} ${e.title}
      </option>
    `;

  });

}

/* PDF */

async function extractText(file){

  const data = await file.arrayBuffer();

  const pdf =
    await pdfjsLib.getDocument({data}).promise;

  let text="";

  for(let i=1;i<=pdf.numPages;i++){

    const page = await pdf.getPage(i);

    const content = await page.getTextContent();

    text += content.items.map(i=>i.str).join(" ")+"\n";

  }

  return text;

}

/* PARSE */

function parseQuestions(text){

  const blocks =
    text.match(/Câu\s*\d+[\s\S]*?(?=Câu\s*\d+|$)/g);

  if(!blocks) return [];

  return blocks.map(b=>{

    const q =
      b.match(/Câu\s*\d+[:.]?\s*(.*?)\s*A\./);

    const opt =
      b.match(/A\.\s*(.*?)\s*B\.\s*(.*?)\s*C\.\s*(.*?)\s*D\.\s*(.*?)(Đáp án|$)/);

    const ans =
      b.match(/Đáp án[:.]?\s*([ABCD])/);

    const map={A:0,B:1,C:2,D:3};

    return {
      question:q? q[1]:"",
      options:opt? [opt[1],opt[2],opt[3],opt[4]]:[],
      answer:ans? map[ans[1]]:0
    };

  });

}

/* UPLOAD */

async function uploadPDF(){

  const file=document.getElementById("pdfInput").files[0];

  const text=await extractText(file);

  const questions=parseQuestions(text);

  let subject=document.getElementById("subject").value;

  let level=null;

  if(subject==="english_basic"){
    subject="english";level="basic";
  }

  if(subject==="english_advanced"){
    subject="english";level="advanced";
  }

  const exams=JSON.parse(localStorage.getItem("exams")||"[]");

  exams.push({
    title:file.name,
    subject,
    level,
    questions
  });

  localStorage.setItem("exams",JSON.stringify(exams));

  refreshExamList();

  alert("Done " + questions.length);

}

/* LOAD */

function loadExam(){

  const i=document.getElementById("examList").value;

  const exams=JSON.parse(localStorage.getItem("exams")||"[]");

  currentExam=exams[i];

  render();

}

/* RENDER */

function render(){

  let html="";

  currentExam.questions.forEach((q,i)=>{

    html+=`
      <div>
        <p><b>${q.question}</b></p>
    `;

    q.options.forEach((o,j)=>{

      html+=`
        <label class="option">
          <input type="radio" name="q${i}" value="${j}">
          ${o}
        </label>
      `;

    });

    html+="</div>";

  });

  html+=`<button onclick="submit()">Submit</button>`;

  document.getElementById("examContent").innerHTML=html;

}

/* SUBMIT */

function submit(){

  let score=0;

  currentExam.questions.forEach((q,i)=>{

    const s=document.querySelector(`input[name=q${i}]:checked`);

    if(s && +s.value===q.answer) score++;

  });

  document.getElementById("scoreBox").innerHTML=
    `Score: ${score}/${currentExam.questions.length}`;

}

</script>

</body>
</html>
